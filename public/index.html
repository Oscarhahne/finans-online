<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affärsspel online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0c3b2a;--panel:#125239;--line:#2a7a5a;--ink:#fff;--mute:#c6f0d8;--dark:#1a1740;--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 15px/1.35 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:800 15px Nunito,sans-serif;min-height:44px;padding:8px 16px;border:0;border-radius:12px;background:#1b7a54;color:#fff;cursor:pointer}
button:hover{background:#17694a}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--gold);color:var(--dark)}button.primary:hover{background:#fcd34d}
button.danger{background:#b91c1c}
input,select{font:700 16px Nunito,sans-serif;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#0a2f22;color:#fff;width:100%}
label{display:block;font-weight:700;margin:0 0 6px;color:var(--mute)}
.home{max-width:560px;margin:0 auto;padding:40px 16px}
.home h1{font-size:60px;line-height:1}.home .lead{color:var(--mute);margin:8px 0 28px}
.card{background:var(--panel);border-radius:20px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.stack{display:grid;gap:12px}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.code{font:600 36px Fredoka,sans-serif;letter-spacing:3px;color:var(--gold)}
.game{display:flex;gap:16px;padding:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.boardwrap{flex:1 1 640px;min-width:0;max-width:990px}
.leftcol{flex:0 0 240px;width:240px;max-width:100%;display:grid;gap:12px;align-content:start}
.landing{background:var(--panel);border-radius:20px;padding:14px;display:grid;gap:10px;align-content:start}
.ltile{border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7);overflow:hidden;font-weight:800;text-align:center}
.ltile .lh{height:30px;background:rgba(255,255,255,.4);border-bottom:1px solid rgba(0,0,0,.45)}
.ltile .lb{padding:14px 8px;display:grid;gap:6px;justify-items:center;font:600 19px/1.15 Fredoka,sans-serif}
.lrow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
@media (max-width:1199px){.leftcol{flex:1 1 100%;width:100%;order:-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.pile{display:grid;gap:5px}.pile h4{margin:0;font:800 13px Nunito,sans-serif;color:var(--mute);display:flex;justify-content:space-between}
.minis{display:flex;flex-wrap:wrap;gap:4px}
.stacks{display:grid;gap:8px}.stack3{display:grid;gap:6px}.cardstack{display:grid}
.stackcard{position:relative;display:block;width:100%;min-height:0;height:58px;padding:0;background:#fbfaf3;color:#1a1740;border:1px solid #1a1740;border-radius:9px;overflow:hidden;text-align:left;font:800 12px/1.1 Nunito,sans-serif;box-shadow:0 -1px 4px rgba(0,0,0,.4)}
.stackcard+.stackcard{margin-top:-28px}
.stackcard:hover,.stackcard:focus-visible{background:#fff;z-index:3;transform:translateY(-2px)}
.stackcard.m{outline:2px dashed #b91c1c;outline-offset:-3px}
.stackcard .band{display:flex;align-items:center;height:30px;padding:0 8px;font-size:13px}
.stackcard .sbody{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px}
.stackcard .b3d{width:24px;height:24px}.stackcard .unbuilt{opacity:.35;filter:grayscale(1)}
.deedmini{width:100px;min-height:74px;padding:0 0 5px;background:#fbfaf3;color:#1a1740;border:1px solid #1a1740;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11.5px/1.1 Nunito,sans-serif;box-shadow:0 3px 5px rgba(0,0,0,.45)}
.deedmini:hover{background:#fff}.deedmini.m{opacity:.75;outline:2px dashed #b91c1c;outline-offset:-3px}
.deedmini .band{align-self:stretch;padding:3px 2px;font-size:10px;letter-spacing:.3px;text-transform:uppercase}
.deedmini .b3d{width:26px;height:26px}.deedmini .unbuilt{opacity:.35;filter:grayscale(1)}
.deed{background:#fbfaf3;color:#1a1740;border:2px solid #1a1740;outline:4px double #1a1740;outline-offset:-9px;border-radius:12px;padding:16px;font-family:Georgia,'Times New Roman',serif}
.dhead{border-radius:6px;padding:12px;text-align:center}.dkind{font:700 12px Nunito,sans-serif;letter-spacing:2px;text-transform:uppercase}.dtitle{font:600 26px/1.1 Fredoka,sans-serif;margin-top:3px}
.dpic{display:flex;justify-content:center;padding:10px 0 2px}.dpic svg{width:84px;height:84px;margin:0}
.drows{display:grid;margin-top:8px}.drow{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px dotted #64748b;font-size:14.5px}.drow b{text-align:right;font-family:Nunito,sans-serif}
.dfoot{margin:10px 0 0;font-size:13px;line-height:1.3}
.activenews{position:absolute;left:875px;top:640px;width:275px;padding:10px 12px;border-radius:12px;background:#fef3a0;color:#1a1740;font:800 14px/1.25 Nunito,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.45);border:2px solid #1a1740}
.c.glow{filter:brightness(1.3) saturate(1.2);box-shadow:0 0 0 4px #fff,0 0 26px 10px rgba(255,255,255,.9);z-index:4}
.c.glow:hover{filter:brightness(1.3) saturate(1.2)}
.mini{min-height:44px;padding:4px 6px;border:0;border-radius:8px;font:800 11.5px/1.1 Nunito,sans-serif;box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.45);text-align:center;width:70px;display:flex;align-items:center;justify-content:center}
.mini.m{opacity:.85;outline:2px dashed #fff;outline-offset:-3px}
.note{background:#d9f99d;color:#14532d}.bond{background:#c4b5fd;color:#1a1740;width:38px}
.events{position:fixed;left:50%;top:128px;transform:translateX(-50%);z-index:42;display:grid;gap:8px;width:min(460px,calc(100vw - 24px));pointer-events:none}
.evt{background:#fff;color:var(--dark);border-left:0;border-radius:14px;padding:10px 14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center;animation:evt .2s ease-out}
@keyframes evt{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.scaler{position:relative;width:100%}
.board{position:absolute;left:0;top:0;width:1290px;height:1185px;transform-origin:0 0;background:#0f4a33;border-radius:28px;overflow:hidden;font-family:Nunito,sans-serif}
.side{flex:0 1 320px;width:320px;max-width:100%;display:grid;gap:12px;min-width:0}
.c{position:absolute;width:105px;height:120px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.25);color:var(--dark);padding:0;font:600 13.5px/1.15 Nunito,sans-serif;text-align:center;overflow-wrap:break-word;cursor:pointer;background:none}
.c[style*='rotate(90deg)'] .lab,.c[style*='rotate(-90deg)'] .lab{font-size:12px}
.pr{font:800 12px/1.1 Nunito,sans-serif;opacity:.95;white-space:nowrap}
.lab{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;text-align:center}
.c:hover{filter:brightness(1.08)}
.n{font:700 11px/14px Nunito,sans-serif;opacity:.85}
.t{font-weight:800}
.head{position:absolute;top:1px;left:1px;right:1px;height:30px;border-radius:13px 13px 0 0;background:rgba(255,255,255,.4);border-bottom:1px solid rgba(0,0,0,.45);display:flex;align-items:center;justify-content:flex-start;gap:3px;padding:0 3px}
.bk{height:105px;font-size:12px}
.h{width:120px;height:120px}
.r{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;text-align:center}
.ic{display:block;margin:0 auto 1px;width:38px;height:26px}
.own{width:16px;height:16px;border-radius:50%;border:2px solid #000;flex:none;position:relative;z-index:1;margin-right:-8px}
.b3d{width:50px;height:50px;flex:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.mort{outline:3px dashed #fff;outline-offset:-6px;opacity:.72}
.token{position:absolute;width:44px;height:62px;transition:left .35s,top .35s;pointer-events:none;z-index:5}
.pawn{display:block;width:100%;height:100%;overflow:visible}
.token.me .pawn{filter:drop-shadow(0 0 4px #fff)}
.title{position:absolute;left:195px;top:128px;width:900px;text-align:center;font:600 76px/1 Fredoka,sans-serif;color:#fff;text-shadow:0 2px 10px #06261b}
.mid{position:absolute;left:645px;top:540px;width:105px;height:645px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7);background:var(--gold);color:var(--dark);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:600 36px/1 Fredoka,sans-serif}
.legend{position:absolute;left:195px;top:220px;width:900px;padding:14px 18px;border-radius:24px;background:rgba(6,38,27,.9);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.l{display:flex;align-items:center;gap:9px;font:700 14px/1.2 Nunito,sans-serif}
.s{width:22px;height:22px;flex:none;border-radius:50%}
.deck{position:absolute;width:170px;height:100px;border-radius:16px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font:600 19px/1 Fredoka,sans-serif;color:var(--dark);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.deck svg{width:66px;height:45px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#0d4230;margin-top:6px}
.pl.on{outline:2px solid var(--gold)}.pl.out{opacity:.45;text-decoration:line-through}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #111}
.pawnicon{display:block;width:26px;height:37px;flex:none}
.money{font-weight:800;white-space:nowrap}
.small{font-size:13px;color:var(--mute)}
.dice{display:flex;gap:8px}.die{width:44px;height:44px;border-radius:10px;background:#fff;color:var(--dark);font:600 26px Fredoka,sans-serif;display:flex;align-items:center;justify-content:center}
.log{max-height:230px;overflow:auto;font-size:13.5px;display:grid;gap:5px;color:#e3f8ec}
.news{padding:10px 12px;border-radius:12px;color:var(--dark);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.modalbg{position:fixed;inset:0;background:rgba(2,20,13,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:620px;max-height:88vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#0d4230;margin-top:6px;flex-wrap:wrap}
.item .btns{display:flex;gap:6px;flex-wrap:wrap}.item button{min-height:44px;padding:6px 12px}
.group{margin-top:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.modal.wide{max-width:820px}
.buygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start;margin-top:10px}
.buybox{background:#0a2f22;border-radius:16px;padding:14px;min-width:0}
.bondgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cardpop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:min(420px,calc(100vw - 32px));padding:24px;border-radius:24px;color:var(--dark);text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6);pointer-events:none;animation:pop .25s ease-out}
.cardpop h2{font-size:26px;margin:6px 0 10px}.cardpop p{margin:0;font-size:19px;font-weight:800;line-height:1.3}.cardpop .ic{width:88px;height:60px}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.cardpop{animation:none}}
.dicestage{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(2,20,13,.45);pointer-events:none}
.dicestage h2{font-size:28px;text-shadow:0 2px 10px #000;position:relative;z-index:1}
.dicerow{display:flex;gap:48px;perspective:800px}
.cube{position:relative;width:100px;height:100px;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:#fff;border:1px solid #cbd5e1;border-radius:18px;box-shadow:inset 0 0 18px rgba(30,27,75,.28);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;backface-visibility:hidden}
.pip{width:18px;height:18px;margin:auto;border-radius:50%;background:#1a1740}
body.rolling .side{pointer-events:none}
#fireworks{position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none}
.winner{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:71;width:min(480px,calc(100vw - 32px));background:rgba(6,38,27,.95);border:3px solid var(--gold);border-radius:28px;padding:32px;text-align:center;display:grid;gap:14px}
.winner h2{font-size:42px;line-height:1.1;color:var(--gold)}
.lastround{background:var(--gold);color:var(--dark);border-radius:12px;padding:10px 12px;font-weight:800;margin-top:10px}
.drawbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:44;width:min(500px,calc(100vw - 24px));max-height:92vh;overflow:auto;background:#0f4a33;border:3px solid #c4b5fd;border-radius:24px;padding:22px;display:grid;gap:12px;box-shadow:0 18px 60px rgba(0,0,0,.7)}
.drawbox h2{font-size:26px;text-align:center}.drawbox .dice{justify-content:center}
.drawrow{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:#c4b5fd;color:var(--dark);border-radius:14px;padding:10px 14px}
.drawrow .small{color:#312e81}.drawrow.none{background:#0d4230;color:#e3f8ec}.drawrow.none .small{color:var(--mute)}
.drawno{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--dark);display:flex;align-items:center;justify-content:center;font:600 22px Fredoka,sans-serif}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw}
</style>
