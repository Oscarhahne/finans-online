<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Affärsspel online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123a;--panel:#1e1b4b;--line:#3b3780;--ink:#fff;--mute:#c7d2fe;--dark:#1a1740;--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 15px/1.35 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font:800 15px Nunito,sans-serif;min-height:44px;padding:8px 16px;border:0;border-radius:12px;background:#312e81;color:#fff;cursor:pointer}
button:hover{background:#3f3ba3}button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--gold);color:var(--dark)}button.primary:hover{background:#fcd34d}
button.danger{background:#b91c1c}
input,select{font:700 16px Nunito,sans-serif;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#100e30;color:#fff;width:100%}
label{display:block;font-weight:700;margin:0 0 6px;color:var(--mute)}
.home{max-width:560px;margin:0 auto;padding:40px 16px}
.home h1{font-size:60px;line-height:1}.home .lead{color:var(--mute);margin:8px 0 28px}
.card{background:var(--panel);border-radius:20px;padding:20px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.stack{display:grid;gap:12px}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.code{font:600 36px Fredoka,sans-serif;letter-spacing:3px;color:var(--gold)}
.game{display:flex;gap:16px;padding:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.boardwrap{flex:1 1 640px;min-width:0;max-width:1100px}
.scaler{position:relative;width:100%}
@media (min-width:900px){.scaler{width:90%;margin:0 auto}}
.board{position:absolute;left:0;top:0;width:1290px;height:1185px;transform-origin:0 0;background:#1e1b4b;border-radius:28px;overflow:hidden;font-family:Nunito,sans-serif}
.side{flex:1 1 340px;max-width:440px;display:grid;gap:12px;min-width:0}
.c{position:absolute;width:105px;height:120px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.25);color:var(--dark);padding:36px 6px 4px;font:600 13.5px/1.15 Nunito,sans-serif;text-align:center;overflow-wrap:break-word;cursor:pointer;background:none}
.c:hover{filter:brightness(1.08)}
.n{position:absolute;top:7px;left:0;right:0;font:700 11px/14px Nunito,sans-serif;opacity:.85}
.t{font-weight:800;padding-top:54px}
.head{position:absolute;top:1px;left:1px;right:1px;height:30px;border-radius:13px 13px 0 0;background:rgba(255,255,255,.4);border-bottom:1px solid rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:5px}
.t .n{top:35px}
.bk{height:105px;padding-top:30px}
.h{width:120px;height:120px;padding:0}
.r{position:absolute;inset:0;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center}
.ic{display:block;margin:0 auto 4px;width:44px;height:30px}
.own{width:16px;height:16px;border-radius:50%;border:2px solid #000}
.house{width:18px;height:18px}
.mort{outline:3px dashed #fff;outline-offset:-6px;opacity:.72}
.token{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #111;display:flex;align-items:center;justify-content:center;font:800 13px Nunito,sans-serif;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.6);transition:left .35s,top .35s;pointer-events:none;z-index:5}
.token.me{outline:3px solid #fff}
.title{position:absolute;left:195px;top:128px;width:900px;text-align:center;font:600 76px/1 Fredoka,sans-serif;color:#fff;text-shadow:0 2px 10px #0f0e3a}
.mid{position:absolute;left:645px;top:540px;width:105px;height:645px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.7);background:var(--gold);color:var(--dark);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:600 36px/1 Fredoka,sans-serif}
.legend{position:absolute;left:195px;top:220px;width:900px;padding:14px 18px;border-radius:24px;background:rgba(15,14,58,.88);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.l{display:flex;align-items:center;gap:9px;font:700 14px/1.2 Nunito,sans-serif}
.s{width:22px;height:22px;flex:none;border-radius:50%}
.deck{position:absolute;width:170px;height:100px;border-radius:16px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font:600 19px/1 Fredoka,sans-serif;color:var(--dark);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.deck svg{width:66px;height:45px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#17153f;margin-top:6px}
.pl.on{outline:2px solid var(--gold)}.pl.out{opacity:.45;text-decoration:line-through}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #111}
.money{font-weight:800;white-space:nowrap}
.small{font-size:13px;color:var(--mute)}
.dice{display:flex;gap:8px}.die{width:44px;height:44px;border-radius:10px;background:#fff;color:var(--dark);font:600 26px Fredoka,sans-serif;display:flex;align-items:center;justify-content:center}
.log{max-height:230px;overflow:auto;font-size:13.5px;display:grid;gap:5px;color:#e0e7ff}
.news{padding:10px 12px;border-radius:12px;color:var(--dark);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.modalbg{position:fixed;inset:0;background:rgba(5,4,25,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:620px;max-height:88vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#17153f;margin-top:6px;flex-wrap:wrap}
.item .btns{display:flex;gap:6px;flex-wrap:wrap}.item button{min-height:44px;padding:6px 12px}
.group{margin-top:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.bondgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#b91c1c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw}
</style>
</head>
