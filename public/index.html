<style>

body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bg) url(bakgrund.jpg) center/cover no-repeat}body:has(.game)::before{display:none}

.home{max-width:560px;margin:0 auto;padding:40px 16px}
.home h1{font-size:clamp(26px,9.6vw,60px);line-height:1}.home .lead{color:var(--mute);margin:8px 0 28px}
.mhome{min-height:100vh;box-sizing:border-box;overflow-x:hidden;display:flex;align-items:center;background:rgba(4,8,20,.74);color:#fff;font-family:Manrope,Nunito,sans-serif}
.mh-wrap{box-sizing:border-box;width:100%;max-width:1400px;margin:0 auto;padding:32px 48px 36px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);grid-template-areas:"head panel" "art panel";grid-template-rows:auto 1fr;column-gap:28px}
.mh-head{grid-area:head}.mh-head h1{margin:0;font:800 clamp(34px,calc((100vw - 692px)*.115),66px)/1 Manrope,Nunito,sans-serif;letter-spacing:-.035em;color:#fff}.mh-head p{margin:18px 0 0;max-width:410px;font-size:16.5px;line-height:1.4;font-weight:600;color:#f1f4f9}
.mh-art{grid-area:art;position:relative;min-width:0}.mh-board{position:relative;width:96%;margin:70px 0 0 -2%;transform:rotate(-2.5deg)}.mh-board img{display:block;width:100%;filter:drop-shadow(0 26px 22px rgba(0,0,0,.72))}.mh-board .mh-pawn{position:absolute;filter:drop-shadow(0 10px 7px rgba(0,0,0,.65))}
.mh-panel{grid-area:panel;min-width:0;margin-top:22px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:2}

.mh-pair{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr)}.mhome button.mh-make{min-height:290px;box-sizing:border-box;padding:24px 60px 26px 24px;border:0;background:#ffc53d;color:#17120a;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;clip-path:polygon(0 0,100% 0,84% 100%,0 100%);transition:filter .12s}.mhome button.mh-make:hover{filter:brightness(1.1);background:#ffc53d;transform:none}.mh-make span{font:800 40px/1.04 Manrope,Nunito,sans-serif;letter-spacing:-.03em}
.mh-join{min-height:290px;box-sizing:border-box;margin-left:-13%;padding:24px 22px 26px 50px;background:#060a14;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;gap:14px;clip-path:polygon(16% 0,100% 0,100% 100%,0 100%)}.mh-join>div{width:100%;display:flex;flex-direction:column;gap:12px}.mh-join label{font-size:27px;line-height:1.05;letter-spacing:-.025em;color:#fff}.mh-codeRow{display:flex;flex-direction:row !important;gap:0 !important}.mh-codeRow input{flex:1;width:auto;min-width:0;height:50px;padding:0 11px;border:2px solid #fff;border-right:0;background:transparent;color:#fff;font:700 15px Manrope,Nunito,sans-serif;text-transform:uppercase}.mh-codeRow input::placeholder{color:#b8c1d0;text-transform:none}.mhome button.mh-white{flex:none;height:50px;min-height:0;padding:0 13px;border:0;background:#fff;color:#060a14;font-weight:800;font-size:14px}.mhome button.mh-white:hover{background:#ffc53d;transform:none}
.mh-open{box-sizing:border-box;padding:16px 20px 14px 40px;background:#060a14;display:flex;flex-direction:column;gap:8px;clip-path:polygon(28px 0,100% 0,100% 100%,0 100%)}.mh-open h2{margin:0;font:800 20px Manrope,Nunito,sans-serif;letter-spacing:-.015em;color:#ffc53d}.mh-rooms{max-height:214px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.mh-room{padding-top:8px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:space-between;gap:12px}.mh-room b{display:block;font-size:16px;font-weight:800}.mh-room small{font-size:13.5px;font-weight:500;color:#d9deea}.mh-room .mh-white{height:44px;padding:0 16px}.mh-empty{margin:0;padding-top:8px;border-top:1px solid rgba(255,255,255,.22);font-size:14.5px;color:#eef1f6}
.mhome button.mh-dice{position:absolute;z-index:3;right:-22px;top:-20px;width:184px;height:152px;min-height:0;padding:0;border:0;background:transparent}.mhome button.mh-dice:hover{background:transparent;transform:none}
.mh-die{--mh-at:0ms;position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;filter:drop-shadow(0 10px 7px rgba(0,0,0,.6))}.mh-d1{--s:84px;--ry:36deg;left:6px;top:6px}.mh-d2{--s:64px;--ry:-30deg;left:108px;top:84px}.mh-cube{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-38deg) rotateY(var(--ry))}.mh-face{position:absolute;inset:0;width:100%;height:100%}.mh-ft{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.mh-fu{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}.mh-ff{transform:translateZ(calc(var(--s)/2));filter:brightness(.86)}.mh-fb{transform:rotateY(180deg) translateZ(calc(var(--s)/2));filter:brightness(.8)}.mh-fr{transform:rotateY(90deg) translateZ(calc(var(--s)/2));filter:brightness(.72)}.mh-fl{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));filter:brightness(.72)}
.mh-roll .mh-die{animation:mh-path 1.5s linear var(--mh-at) both}.mh-roll .mh-cube{animation:mh-spin 1.5s cubic-bezier(.16,.7,.3,1) var(--mh-at) both}.mh-roll .mh-d2,.mh-roll .mh-d2 .mh-cube{animation-delay:calc(var(--mh-at) + 140ms)}
@keyframes mh-path{0%{opacity:0;transform:translate(-500px,-210px)}6%{opacity:1}45%{transform:translate(-132px,0)}62%{transform:translate(-58px,-52px)}78%{transform:translate(-16px,0)}88%{transform:translate(-5px,-14px)}100%{opacity:1;transform:translate(0,0)}}
@keyframes mh-spin{0%{transform:rotateX(-1118deg) rotateY(calc(var(--ry) + 1440deg))}100%{transform:rotateX(-38deg) rotateY(var(--ry))}}
@media (prefers-reduced-motion:reduce){.mh-die,.mh-cube{animation:none !important}}
